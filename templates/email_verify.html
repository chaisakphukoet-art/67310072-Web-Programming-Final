<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - TechNova IT Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .verify-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            max-width: 480px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        .icon-success {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 2px solid #10b981;
        }
        .icon-fail {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 2px solid #ef4444;
        }
        .btn-brand {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            font-weight: 600;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
        }
        .btn-brand:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="verify-card">
        {% if verified %}
            <div class="icon-box icon-success">
                <i class="bi bi-patch-check-fill"></i>
            </div>
            <h3 class="fw-bold mb-2">Verification Successful</h3>
            <p class="text-secondary mb-4">{{ message }}</p>
            <div class="p-3 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25 mb-4 text-start small">
                <div class="text-muted">Verified Account:</div>
                <div class="fw-semibold text-light">{{ email }}</div>
            </div>
            <a href="/" class="btn btn-brand w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Go to Store & Sign In
            </a>
        {% else %}
            <div class="icon-box icon-fail">
                <i class="bi bi-exclamation-octagon-fill"></i>
            </div>
            <h3 class="fw-bold mb-2">Verification Failed</h3>
            <p class="text-secondary mb-4">{{ message }}</p>
            <a href="/" class="btn btn-brand w-100">
                <i class="bi bi-arrow-left me-2"></i>Return to TechNova Store
            </a>
        {% endif %}
    </div>
</body>
</html>
